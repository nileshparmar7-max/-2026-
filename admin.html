<!doctype html><html lang="gu"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin Dashboard | વટવા યુવા સંમેલન</title><link rel="stylesheet" href="styles.css"><style>.admin{max-width:1200px;margin:auto;padding:40px 20px}.admin-card{background:#fff;border:1px solid #efd8c5;border-radius:22px;padding:25px;box-shadow:0 18px 45px #8f4a2012;margin-bottom:22px}.admin-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:15px}.stat{background:#fff7ee;border-radius:16px;padding:18px;text-align:center}.stat b{display:block;font-size:30px;color:#e95d08}.toolbar{display:flex;gap:10px;margin:15px 0;flex-wrap:wrap}.toolbar input{max-width:350px}.table-wrap{overflow:auto}table{width:100%;border-collapse:collapse}th,td{padding:10px;border-bottom:1px solid #f0dfd2;text-align:left;white-space:nowrap}th{color:#c94d08}.login{max-width:430px;margin:80px auto}.hidden{display:none}.danger{background:#333!important}</style></head><body><header class="nav"><div class="nav-inner"><a class="brand" href="index.html"><div class="brand-mark">ॐ</div><div><strong>યુવા સંમેલન 2026</strong><small>વટવા નગર · Admin</small></div></a></div></header><main class="admin"><section id="login" class="admin-card login"><h2>🔐 Admin Login</h2><p>Admin password દાખલ કરો.</p><input id="password" type="password" placeholder="Admin password"><button id="loginBtn" class="submit-btn" style="width:100%;margin-top:15px">Login</button><p id="loginMsg"></p></section><section id="dashboard" class="hidden"><div class="admin-card"><h1>વટવા નગર — Registration Dashboard</h1><div class="admin-grid"><div class="stat"><b id="total">0</b>Total</div><div class="stat"><b id="today">0</b>Today</div><div class="stat"><b id="whatsapp">0</b>WhatsApp</div><div class="stat"><b id="last">—</b>Latest</div></div><div class="toolbar"><input id="search" placeholder="નામ / મોબાઇલ / ઈમેઈલથી શોધો"><button id="refresh" class="submit-btn">Refresh</button><button id="csv" class="submit-btn">CSV Download</button><button id="logout" class="submit-btn danger">Logout</button></div><div class="table-wrap"><table><thead><tr><th>ID</th><th>નામ</th><th>ઉંમર</th><th>અભ્યાસ</th><th>મોબાઇલ</th><th>WhatsApp</th><th>Email</th><th>એરિયા</th><th>રસ</th><th>તારીખ</th></tr></thead><tbody id="rows"></tbody></table></div></div></section></main><script src="admin.js"></script></body></html>
